<svg 
  width="24" 
  height="24" 
  viewBox="0 0 60 60" 
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Dark background rectangle -->
  <rect 
    width="60" 
    height="60" 
    fill="#1a3148" 
  />
  
  <!-- 3x3 grid of white dots -->
  <circle cx="10" cy="10" r="5" fill="#fff" />
  <circle cx="30" cy="10" r="5" fill="#fff" />
  <circle cx="50" cy="10" r="5" fill="#fff" />

  <circle cx="10" cy="30" r="5" fill="#fff" />
  <circle cx="30" cy="30" r="5" fill="#fff" />
  <circle cx="50" cy="30" r="5" fill="#fff" />

  <circle cx="10" cy="50" r="5" fill="#fff" />
  <circle cx="30" cy="50" r="5" fill="#fff" />
  <circle cx="50" cy="50" r="5" fill="#fff" />
</svg>